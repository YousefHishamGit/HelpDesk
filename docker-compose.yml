services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=HelpDeskDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      - Jwt__SecretKey=${JWT_KEY}
    depends_on:
      - db
    restart: on-failure

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - sqldata:/var/opt/mssql

  frontend:
    build: ./frontend/HelpDeskFront/HelpDesk
    ports:
      - "4200:80"
    depends_on:
      - api  

volumes:
  sqldata: